<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Read & Play – piano prototype</title>
<style>
  :root{
    --bg:#fff8ec; --card:#ffffff; --ink:#2b2438; --muted:#7a7088; --line:#e9dfcf; --accent:#6c4bd8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .app{max-width:520px;margin:0 auto;padding:14px 12px 28px}
  h1{font-size:20px;margin:4px 4px 10px;display:flex;align-items:center;gap:8px}
  h1 small{font-weight:600;font-size:12px;color:var(--muted);background:#f1e8d6;padding:2px 8px;border-radius:99px}
  .songs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;min-height:44px;cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:#efeaff;color:#40289a}
  .card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 8px}
  .staffwrap{padding:2px 4px}
  .staffwrap svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding:2px 0 4px;flex-wrap:wrap}
  .legend i{font-style:normal;font-size:15px;margin-right:3px;color:#444}
  .status{min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:19px;padding:8px 6px}
  .status .sub{display:block;font-weight:600;font-size:13px;color:var(--muted)}
  .kbwrap{margin:6px 0 4px}
  .kb{position:relative;height:190px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .key{position:absolute;top:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .key.white{height:100%;background:#fff;border:2px solid #cfc6d8;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800;font-size:18px;color:#8b8298;transition:background .08s}
  .key.black{height:60%;background:#2b2438;border-radius:0 0 8px 8px;z-index:2;border:2px solid #1b1626}
  .key.lit{background:var(--c)!important;color:#fff}
  .kb.colored .key.white .lab:not(:empty){background:var(--c);color:var(--t,#fff);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}
  .kb.colored .key.white.lit .lab{box-shadow:0 0 0 3px #fff}
  .badge{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;font-size:.92em;margin-left:4px;vertical-align:middle}
  .key.black.lit{background:#6a5a86!important}
  .key.target::after{content:"";position:absolute;inset:3px;border-radius:0 0 10px 10px;border:4px solid var(--c);animation:pulse 1s ease-in-out infinite;pointer-events:none}
  .key.miss{animation:shake .28s}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.97)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{flex:1 1 auto;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:800;font-size:15px;color:var(--ink);padding:10px 12px;border-radius:14px;min-height:46px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[aria-pressed="true"]{background:#efeaff;border-color:var(--accent);color:#40289a}
  .mic{margin-top:10px;font-size:13px;color:var(--muted)}
  .meter{height:8px;background:#efe6d6;border-radius:99px;overflow:hidden;margin:6px 0}
  .meter div{height:100%;width:0;background:#2fa84f;transition:width .06s}
  .note{font-size:12px;color:var(--muted);margin:10px 4px 0;line-height:1.45}
  .done{position:fixed;inset:0;background:rgba(43,36,56,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .done.show{display:flex}
  .done .box{background:#fff;border-radius:24px;padding:24px 22px;text-align:center;max-width:340px;width:100%}
  .done .stars{font-size:44px;letter-spacing:4px}
  .done h2{margin:6px 0 4px}
  .done p{margin:0 0 14px;color:var(--muted)}
  .done .row{display:flex;gap:8px}
  .who{display:flex;gap:10px;margin-bottom:10px}
  .who button{flex:1;display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;min-height:56px;font:inherit;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer}
  .who button[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,white)}
  .who .av{width:36px;height:36px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
  .chip .st{color:#d79a00;margin-left:4px;letter-spacing:1px;font-size:13px}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none}
  .done .tricky{font-size:13px;color:var(--muted);margin:-6px 0 14px}
  .side-a,.main,.side-b{display:contents}
  .progress{height:8px;background:#efe6d6;border-radius:99px;margin:6px 8px 2px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}

  /* ---- iPad / tablet in landscape ---- */
  @media (min-width:900px) and (orientation:landscape){
    html,body{height:100%;overflow:hidden}
    .app{max-width:none;height:100vh;height:100dvh;padding:16px 18px;display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto 1fr;column-gap:20px;overflow:hidden}
    .side-a{display:block;grid-column:1;grid-row:1}
    .side-b{display:block;grid-column:1;grid-row:2;overflow:auto;min-height:0;padding-bottom:4px}
    .main{display:flex;flex-direction:column;grid-column:2;grid-row:1/3;min-height:0}
    h1{font-size:24px;margin:0 2px 12px}
    .who{gap:8px}
    .who button{padding:6px 10px;min-height:56px;font-size:18px}
    .songs{flex-direction:column;flex-wrap:nowrap;gap:8px;margin-bottom:12px}
    .chip{border-radius:16px;text-align:left;font-size:16px;padding:11px 16px;min-height:50px;border-width:3px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .controls .btn{font-size:16px;min-height:52px;padding:8px 10px}
    .note{display:none}
    .main .card{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:14px 16px}
    .staffwrap{padding:0}
    .staffwrap svg{width:100%;height:auto;max-height:calc((100dvh - 430px)/2);margin:0 auto}
    .status{min-height:64px;font-size:26px}
    .status .sub{font-size:15px}
    .kbwrap{margin:0}
    .kb{height:clamp(170px,31dvh,300px)}
    .key.white{font-size:22px;padding-bottom:14px}
    .kb.colored .key.white .lab:not(:empty){width:50px;height:50px;font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){.key.target::after,.key.miss{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="side-a">
    <h1>Read &amp; Play <small>prototype</small></h1>
    <div class="who" id="who" role="group" aria-label="Who is playing?"></div>
    <div class="songs" id="songs" role="group" aria-label="Choose a song"></div>
  </div>

  <div class="main">
    <div class="card">
      <div class="staffwrap" id="staff" aria-label="Sheet music"></div>
      <div class="legend"><span><i>●</i>1 beat</span><span><i>○</i>2 beats (hold)</span><span><i>◯</i>4 beats (hold)</span></div>
      <div class="progress" id="prog"><i></i></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="kbwrap"><div class="kb" id="kb"></div></div>
  </div>

  <div class="side-b">
    <div class="controls">
      <button class="btn primary" id="listen">▶ Listen first</button>
      <button class="btn" id="mic" aria-pressed="false">🎤 Listen to my piano</button>
    </div>
    <div class="controls">
      <button class="btn" id="helpers" aria-pressed="true">🌈 Helpers</button>
      <button class="btn" id="names" aria-pressed="true">🔤 Note names</button>
      <button class="btn" id="lyrics" aria-pressed="true">🎵 Lyrics</button>
      <button class="btn" id="restart">↺ Start over</button>
    </div>

    <div class="mic" id="micbox" hidden>
      <div id="micmsg"></div>
      <div class="meter"><div id="level"></div></div>
      <label style="display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:700">Sensitivity
        <input type="range" id="sens" min="1" max="12" value="6" style="flex:1"></label>
      <div id="heard"></div>
      <div id="dbg" style="font-size:11px;color:#a59bb3;margin-top:2px"></div>
    </div>

    <p class="note">Tap the keys on screen, or switch on the microphone and play a real piano or keyboard nearby. Helpers colour-match each note to its key; switch them off for a challenge.</p>
  </div>
</div>

<div class="done" id="done"><div class="box">
  <div class="stars" id="stars"></div>
  <h2 id="donetitle">You played it!</h2>
  <p id="donetxt"></p>
  <p class="tricky" id="tricky"></p>
  <div class="row"><button class="btn" id="again">Play again</button><button class="btn primary" id="next">Next song ›</button></div>
</div></div>
<canvas id="confetti"></canvas>

<script>
/* ---------- music data ---------- */
const INFO = {
  C:{step:0,midi:60,color:'#e5484d'}, D:{step:1,midi:62,color:'#f08c1a'}, E:{step:2,midi:64,color:'#e0a800'},
  F:{step:3,midi:65,color:'#2fa84f'}, G:{step:4,midi:67,color:'#2f7de1'}, A:{step:5,midi:69,color:'#8e4ec6'},
  B:{step:6,midi:71,color:'#e5589b'}, c:{step:7,midi:72,color:'#e5484d'},
  d:{step:8,midi:74,color:'#f08c1a'}, e:{step:9,midi:76,color:'#e0a800'}, f:{step:10,midi:77,color:'#2fa84f'}, g:{step:11,midi:79,color:'#2f7de1'}
};
const NAME_BY_MIDI = {60:'C',62:'D',64:'E',65:'F',67:'G',69:'A',71:'B',72:'C',74:'D',76:'E',77:'F',79:'G'};
const WHITES = 12;  // C4 up to G5
const KEYS = [
  {m:60,w:1},{m:61,w:0,after:0},{m:62,w:1},{m:63,w:0,after:1},{m:64,w:1},{m:65,w:1},
  {m:66,w:0,after:3},{m:67,w:1},{m:68,w:0,after:4},{m:69,w:1},{m:70,w:0,after:5},{m:71,w:1},{m:72,w:1},
  {m:73,w:0,after:7},{m:74,w:1},{m:75,w:0,after:8},{m:76,w:1},{m:77,w:1},{m:78,w:0,after:10},{m:79,w:1}
];
const SONGS = [
  {title:'Hot Cross Buns', lines:['E D C2','E D C2','C C C C D D D D','E D C2'],
   lyrics:['Hot cross buns','Hot cross buns','One a pen- ny two a pen- ny','Hot cross buns']},
  {title:'Mary Had a Little Lamb', lines:['E D C D E E E2','D D D2 E G G2','E D C D E E E E','D D E D C4'],
   lyrics:['Ma- ry had a lit- tle lamb','lit- tle lamb lit- tle lamb','Ma- ry had a lit- tle lamb its','fleece was white as snow']},
  {title:'Twinkle Twinkle', lines:['C C G G A A G2','F F E E D D C2','G G F F E E D2','G G F F E E D2','C C G G A A G2','F F E E D D C2'],
   lyrics:['Twin- kle twin- kle lit- tle star','How I won- der what you are','Up a- bove the world so high','Like a dia- mond in the sky','Twin- kle twin- kle lit- tle star','How I won- der what you are']},
  {title:'Ode to Joy (easy)', lines:['E E F G G F E D','C C D E E2 D2','E E F G G F E D','C C D E D2 C2']},
  {title:'Happy Birthday', lines:['G G A G c B2','G G A G d c2','G G g e c B A2','f f e c d c2'],
   lyrics:['Hap- py birth- day to you','Hap- py birth- day to you','Hap- py birth- day dear %1 %2','Hap- py birth- day to you']}
];

/* ---------- state ---------- */
let songIdx=0, notes=[], idx=0, misses=0, totalMiss=0, missesInRow=0;
let helpers=true, showNames=true, showLyrics=true, listening=false, listenIdx=-1, listenTimer=null;
const $ = id => document.getElementById(id);

function lyricText(raw){
  const p = (typeof PROFILES!=='undefined' && PROFILES.find(x=>x.name===store.current)) || {syl:['Name','']};
  let t = raw.replace('%1', p.syl[0]+(p.syl[1]?'-':'')).replace('%2', p.syl[1]||'');
  const cont = t.endsWith('-'); if(cont) t=t.slice(0,-1);
  return {t, cont};
}
function parseSong(s){
  const out=[]; s.lines.forEach((ln,li)=>{
    ln.split(' ').forEach((tok,ti)=>{
      const m=/^([A-Gcdefg])(\d)?$/.exec(tok); const name=m[1]; const beats=m[2]?+m[2]:1;
      const lyr = s.lyrics && s.lyrics[li] ? (s.lyrics[li].split(' ')[ti]||'') : '';
      out.push({name,beats,line:li,pos:ti,midi:INFO[name].midi,lyric:lyr});
    });
  });
  return out;
}

/* ---------- audio: a soft piano-ish tone ---------- */
let ac=null;
function audio(){
  if(!ac){ const C=window.AudioContext||window.webkitAudioContext; try{ ac=new C({latencyHint:'interactive'}); }catch(e){ ac=new C(); } }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function tone(midi,dur,vol){
  dur=dur||0.9; vol=vol||0.33;
  const a=audio(), t=a.currentTime, f=440*Math.pow(2,(midi-69)/12);
  const g=a.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+Math.max(0.35,dur));
  g.connect(a.destination);
  [[1,1],[2,0.4],[3,0.18],[4,0.08]].forEach(([mult,v])=>{
    const o=a.createOscillator(); o.type='sine'; o.frequency.value=f*mult;
    const og=a.createGain(); og.gain.value=v; o.connect(og); og.connect(g);
    o.start(t); o.stop(t+Math.max(0.35,dur)+0.1);
  });
}

/* ---------- rendering: staff ---------- */
const BOTTOM_Y=70, STEP_PX=5, X0=62, SPACING=35;
const yOf = step => BOTTOM_Y-(step-2)*STEP_PX;

const wideMQ = window.matchMedia('(min-width: 900px) and (orientation: landscape)');
function renderStaff(){
  const lines = SONGS[songIdx].lines.length;
  let first=0, last=lines-1;
  if(wideMQ.matches && notes.length){
    // tablet landscape: big staves, showing the line being played and the one after it
    const ref = Math.min(listening ? Math.max(listenIdx,0) : idx, notes.length-1);
    first = notes[ref].line; last = Math.min(first+1, lines-1);
  }
  let html='';
  for(let li=first; li<=last; li++){
    const ln = notes.filter(n=>n.line===li);
    let hl='', body='', lyr='';
    ln.forEach(n=>{
      const i=notes.indexOf(n), info=INFO[n.name], x=X0+n.pos*SPACING+SPACING/2-6, y=yOf(info.step);
      const cur = listening ? i===listenIdx : (i===idx);
      const doneNote = !listening && i<idx;
      const colored = helpers || doneNote || (listening && i<=listenIdx);
      const col = colored ? info.color : '#444';
      if(cur) hl+=`<rect x="${x-17}" y="16" width="34" height="92" rx="11" fill="#fff0b3"/>`;
      let g='';
      if(info.step===0) g+=`<line x1="${x-11}" x2="${x+11}" y1="${y}" y2="${y}" stroke="#444" stroke-width="1.6"/>`;
      const hollow=n.beats>=2;
      g+=`<ellipse cx="${x}" cy="${y}" rx="7" ry="5.3" transform="rotate(-20 ${x} ${y})" fill="${hollow?'#fff':col}" stroke="${col}" stroke-width="${hollow?3:1.6}"/>`;
      if(n.beats<4){
        const down=info.step>=6;
        g+= down ? `<line x1="${x-6.4}" y1="${y}" x2="${x-6.4}" y2="${y+30}" stroke="#333" stroke-width="1.6"/>`
                 : `<line x1="${x+6.4}" y1="${y}" x2="${x+6.4}" y2="${y-30}" stroke="#333" stroke-width="1.6"/>`;
      }
      body+=`<g opacity="${doneNote?0.45:1}">${g}</g>`;
      if(showLyrics && n.lyric){
        const L=lyricText(n.lyric);
        lyr+=`<text x="${x}" y="103" text-anchor="middle" font-size="12.5" font-weight="${cur?800:600}" fill="#3a3346" opacity="${doneNote?0.5:1}">${L.t}</text>`;
        if(L.cont) lyr+=`<text x="${x+SPACING/2}" y="103" text-anchor="middle" font-size="12.5" fill="#3a3346" opacity="${doneNote?0.5:1}">-</text>`;
        if(cur && colored) lyr+=`<rect x="${x-Math.max(8,L.t.length*3.4)}" y="107" width="${Math.max(16,L.t.length*6.8)}" height="3.2" rx="1.6" fill="${col}"/>`;
      }
    });
    let staffLines='';
    for(let k=0;k<5;k++) staffLines+=`<line x1="4" x2="352" y1="${30+k*10}" y2="${30+k*10}" stroke="#555" stroke-width="1.2"/>`;
    const last = li===lines-1;
    const bar = last
      ? `<line x1="344" x2="344" y1="30" y2="70" stroke="#333" stroke-width="1.6"/><line x1="351" x2="351" y1="30" y2="70" stroke="#333" stroke-width="4"/>`
      : `<line x1="351" x2="351" y1="30" y2="70" stroke="#333" stroke-width="1.6"/>`;
    const clef=`<text x="7" y="75" font-size="62" fill="#333" font-family="'Noto Music','Segoe UI Symbol','Apple Symbols','Bravura Text',serif">\u{1D11E}</text>`;
    html+=`<svg viewBox="0 12 360 100" role="img" aria-label="Line ${li+1} of the music">${hl}${staffLines}${clef}${bar}${body}${lyr}</svg>`;
  }
  $('staff').innerHTML=html;
}

/* ---------- rendering: keyboard ---------- */
function buildKeyboard(){
  const kb=$('kb'); kb.innerHTML='';
  let wi=0;
  KEYS.forEach(k=>{
    const el=document.createElement('div');
    el.dataset.midi=k.m;
    if(k.w){
      el.className='key white'; el.style.left=(wi*100/WHITES)+'%'; el.style.width=(100/WHITES)+'%';
      el.style.setProperty('--c', INFO[NAME_BY_MIDI[k.m]].color);
      el.style.setProperty('--t', NAME_BY_MIDI[k.m]==='E' ? '#2b2438' : '#fff');
      const lab=document.createElement('span'); lab.className='lab'; el.appendChild(lab);
      wi++;
    } else {
      el.className='key black'; el.style.left=((k.after+1)*100/WHITES-100/WHITES*0.272)+'%'; el.style.width=(100/WHITES*0.544)+'%';
    }
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); press(k.m,'tap'); });
    kb.appendChild(el);
  });
  refreshKeys();
}
function keyEl(m){ return $('kb').querySelector(`[data-midi="${m}"]`); }
function refreshKeys(){
  $('kb').classList.toggle('colored', helpers);
  const target = (!listening && idx<notes.length) ? notes[idx] : null;
  $('kb').querySelectorAll('.key').forEach(el=>{
    const m=+el.dataset.midi;
    const isTarget = target && target.midi===m && (helpers || missesInRow>=2);
    el.classList.toggle('target', !!isTarget);
    const lab=el.querySelector('.lab');
    if(lab) lab.textContent = showNames ? NAME_BY_MIDI[m] : '';
  });
}
function flash(m, ok){
  const el=keyEl(m); if(!el) return;
  const white = NAME_BY_MIDI[m];
  if(white) el.style.setProperty('--c', INFO[white].color);
  el.classList.add('lit');
  if(!ok){ el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss'); }
  setTimeout(()=>{ el.classList.remove('lit'); el.classList.remove('miss'); }, 380);
}

/* ---------- lesson logic ---------- */
function setStatus(main, sub){
  $('status').innerHTML = `<div>${main}</div>` + (sub?`<span class="sub">${sub}</span>`:'');
}
function updateStatus(){
  if(listening){ setStatus('Listen…','Watch the notes and keys light up'); return; }
  if(idx>=notes.length){ setStatus('🎉 All done!'); return; }
  const n=notes[idx];
  const nm = NAME_BY_MIDI[n.midi];
  const hold = n.beats>1 ? ` · hold for ${n.beats} beats` : '';
  const badge = helpers ? `<span class="badge" style="background:${INFO[nm].color};color:${nm==='E'?'#2b2438':'#fff'}">${nm}</span>` : nm;
  if(showNames) setStatus(`Play the note ${badge}`, `Note ${idx+1} of ${notes.length}${hold}`);
  else setStatus('Find this note on the keys', `Note ${idx+1} of ${notes.length}${hold}`);
}
function render(){ renderStaff(); refreshKeys(); updateStatus(); $('prog').firstElementChild.style.width=(notes.length?Math.min(100,idx/notes.length*100):0)+'%'; }
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(render,120); });

function press(m, src){
  if(listening) return;
  if(src==='tap') tone(m, 0.9);
  if(idx>=notes.length) { flash(m,true); return; }
  const target=notes[idx];
  const ok = m===target.midi || (src==='mic' && (m-target.midi)%12===0);
  flash(m, ok);
  if(ok){
    if(helpers) runUsedHelpers=true;
    idx++; missesInRow=0; render();
    if(idx>=notes.length) setTimeout(finish, 450);
  } else {
    totalMiss++; missesInRow++;
    const tn=NAME_BY_MIDI[target.midi];
    runMiss[tn]=(runMiss[tn]||0)+1;
    const mm=me().misses; mm[tn]=(mm[tn]||0)+1; saveStore();
    refreshKeys();
    const nm = NAME_BY_MIDI[m] ? NAME_BY_MIDI[m] : 'a black key';
    setStatus(`That was ${nm}`, missesInRow>=2 ? 'Look for the glowing key' : 'Try again — you can do it');
  }
}
function finish(){
  // every note has been identified correctly to get here; stars reflect how smoothly
  const stars = totalMiss<=2 ? 3 : totalMiss<=6 ? 2 : 1;
  const title=SONGS[songIdx].title, prof=me();
  const rec = prof.songs[title] || (prof.songs[title]={best:0,plays:0,noHelp:0});
  rec.plays++; rec.best=Math.max(rec.best,stars); rec.last=Date.now();
  if(!runUsedHelpers) rec.noHelp=Math.max(rec.noHelp,stars);
  saveStore(); renderChips();
  const praise = stars===3 ? 'Amazing' : stars===2 ? 'Great job' : 'Well done';
  $('donetitle').textContent = `${praise}, ${store.current}!`;
  $('stars').textContent = '★'.repeat(stars)+'☆'.repeat(3-stars);
  let msg = totalMiss===0 ? 'Every note first time!' : `${totalMiss} wobble${totalMiss===1?'':'s'} on the way — you got there.`;
  if(!runUsedHelpers) msg += ' 🏅 And no helpers!';
  $('donetxt').textContent = msg;
  const worst = Object.entries(runMiss).sort((a,b)=>b[1]-a[1])[0];
  $('tricky').textContent = worst ? `Tricky note this time: ${worst[0]}` : '';
  $('done').classList.add('show');
  confetti(stars===3);
  [60,64,67,72,76].forEach((m,i)=>setTimeout(()=>tone(m>72?72:m,0.7),i*140));
}
function loadSong(i){
  stopListen(); stopConfetti();
  songIdx=i; notes=parseSong(SONGS[i]); idx=0; totalMiss=0; missesInRow=0;
  runUsedHelpers=false; runMiss={};
  $('done').classList.remove('show');
  renderChips();
  render();
}

/* ---------- profiles & progress (stored on this device only) ---------- */
const PROFILES=[{name:'Ayla',color:'#8e4ec6',syl:['Ay','la']},{name:'Eden',color:'#1f9d8a',syl:['Ee','den']}];
let store={current:PROFILES[0].name,data:{}};
let runUsedHelpers=false, runMiss={};
function loadStore(){
  try{ const s=JSON.parse(localStorage.getItem('readplay.v1')||'null'); if(s&&s.data) store=s; }catch(e){}
  PROFILES.forEach(p=>{ if(!store.data[p.name]) store.data[p.name]={songs:{},misses:{}}; });
  if(!store.data[store.current]) store.current=PROFILES[0].name;
}
function saveStore(){ try{ localStorage.setItem('readplay.v1',JSON.stringify(store)); }catch(e){} }
function me(){ return store.data[store.current]; }
function renderWho(){
  const w=$('who'); w.innerHTML='';
  PROFILES.forEach(p=>{
    const b=document.createElement('button'); b.style.setProperty('--pc',p.color);
    b.setAttribute('aria-pressed', p.name===store.current);
    b.innerHTML=`<span class="av">${p.name[0]}</span>${p.name}`;
    b.addEventListener('click',()=>{ audio(); store.current=p.name; saveStore(); renderWho(); loadSong(songIdx); });
    w.appendChild(b);
  });
}
function renderChips(){
  const box=$('songs'); box.innerHTML='';
  SONGS.forEach((s,i)=>{
    const r=me().songs[s.title];
    const st = r ? `<span class="st">${'★'.repeat(r.best)}${'☆'.repeat(3-r.best)}${r.noHelp?' 🏅':''}</span>` : '';
    const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed', i===songIdx);
    b.innerHTML=`${s.title}${st}`;
    b.addEventListener('click',()=>{ audio(); loadSong(i); });
    box.appendChild(b);
  });
}

/* ---------- confetti ---------- */
let confettiRaf=null;
function stopConfetti(){ cancelAnimationFrame(confettiRaf); const cv=$('confetti'); cv.style.display='none'; }
function confetti(big){
  const cv=$('confetti');
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr=window.devicePixelRatio||1, ctx=cv.getContext('2d');
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cv.style.display='block';
  const cols=['#e5484d','#f08c1a','#e0a800','#2fa84f','#2f7de1','#8e4ec6','#e5589b'];
  const N=big?240:150, ps=[];
  for(let i=0;i<N;i++) ps.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*0.7,w:(6+Math.random()*7)*dpr,h:(9+Math.random()*10)*dpr,
    vx:(Math.random()-0.5)*2*dpr,vy:(2+Math.random()*3.5)*dpr,r:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length]});
  const t0=performance.now(); cancelAnimationFrame(confettiRaf);
  (function frame(){
    const el=performance.now()-t0; ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    ps.forEach(p=>{
      p.x+=p.vx+Math.sin(p.y/40)*0.6*dpr; p.y+=p.vy; p.r+=p.vr;
      if(p.y<cv.height+20*dpr) alive=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.globalAlpha = el>4500 ? Math.max(0,1-(el-4500)/800) : 1;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(alive && el<5300) confettiRaf=requestAnimationFrame(frame); else stopConfetti();
  })();
}

/* ---------- "Listen first" playback ---------- */
const BEAT=0.55;
function stopListen(){
  if(listenTimer){ clearTimeout(listenTimer); listenTimer=null; }
  if(listening){ listening=false; listenIdx=-1; $('listen').textContent='▶ Listen first'; render(); }
}
function startListen(){
  if(listening){ stopListen(); return; }
  audio(); listening=true; listenIdx=-1; $('listen').textContent='■ Stop';
  let i=0;
  const step=()=>{
    if(i>=notes.length){ stopListen(); return; }
    listenIdx=i; const n=notes[i];
    tone(n.midi, n.beats*BEAT*0.95+0.2, 0.33);
    muteMicFor(n.beats*BEAT*1000+400);
    render(); flash(n.midi,true);
    i++; listenTimer=setTimeout(step, n.beats*BEAT*1000);
  };
  step();
}

/* ---------- microphone: pitch detection ---------- */
// PITCH-START
let lastClarity=0;
function detectPitch(buf, sr, minRms){
  const SIZE=buf.length; let rms=0, peak=0;
  for(let i=0;i<SIZE;i++){ rms+=buf[i]*buf[i]; if(Math.abs(buf[i])>peak) peak=Math.abs(buf[i]); }
  rms=Math.sqrt(rms/SIZE); if(rms<(minRms||0.002)) return -1;
  const thres=0.2*peak; let r1=0, r2=SIZE-1;
  for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<thres){ r1=i; break; } }
  for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
  const b=buf.slice(r1,r2), N=b.length; if(N<64) return -1;
  const c=new Float32Array(N);
  for(let i=0;i<N;i++){ let s=0; for(let j=0;j<N-i;j++) s+=b[j]*b[j+i]; c[i]=s; }
  let d=0; while(d<N-1 && c[d]>c[d+1]) d++;
  let mx=-1, mp=-1; for(let i=d;i<N;i++){ if(c[i]>mx){ mx=c[i]; mp=i; } }
  let T0=mp; if(T0<=0||T0>=N-1) return -1;
  const x1=c[T0-1], x2=c[T0], x3=c[T0+1];
  const a=(x1+x3-2*x2)/2, bb=(x3-x1)/2; if(a) T0=T0-bb/(2*a);
  lastClarity = (c[0]>0 && mp<N) ? (mx/c[0])*(N/(N-mp)) : 0;  // 1.0 = perfectly periodic
  return sr/T0;
}
// PITCH-END

let micOn=false, micStream=null, analyser=null, micSrc=null, micBuf=null;
let lastTick=0, prevRms=0, armed=true, cand=[], fireRms=0, muteUntil=0;
let noise=0.003, lastMidi=-1, sens=6;
function muteMicFor(ms){ muteUntil=performance.now()+ms; cand=[]; armed=false; }

async function startMic(){
  const box=$('micbox'); box.hidden=false;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('unavailable');
    const a=audio();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,latency:0}});
    micSrc=a.createMediaStreamSource(micStream);
    analyser=a.createAnalyser(); analyser.fftSize=1024; micSrc.connect(analyser);
    micBuf=new Float32Array(analyser.fftSize);
    micOn=true; armed=true; cand=[]; prevRms=0; noise=0.003; lastMidi=-1;
    $('mic').setAttribute('aria-pressed','true'); $('mic').textContent='🎤 Listening… (tap to stop)';
    $('micmsg').textContent='Play a note on your piano. Keep other noise down.';
    requestAnimationFrame(micTick);
  }catch(e){
    micOn=false;
    $('mic').setAttribute('aria-pressed','false'); $('mic').textContent='🎤 Listen to my piano';
    $('micmsg').textContent='The microphone isn’t available in this view, so tap the on-screen keys instead. Microphone listening works when this page is opened in a normal browser tab.';
    $('heard').textContent=''; $('level').style.width='0';
  }
}
function stopMic(){
  micOn=false;
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  if(micSrc){ try{micSrc.disconnect();}catch(e){} micSrc=null; }
  $('mic').setAttribute('aria-pressed','false'); $('mic').textContent='🎤 Listen to my piano';
  $('micbox').hidden=true; $('level').style.width='0'; $('heard').textContent='';
}
function micTick(){
  if(!micOn) return;
  requestAnimationFrame(micTick);
  const now=performance.now(); if(now-lastTick<14) return; lastTick=now;
  analyser.getFloatTimeDomainData(micBuf);
  let s=0; for(let i=0;i<micBuf.length;i++) s+=micBuf[i]*micBuf[i];
  const rms=Math.sqrt(s/micBuf.length);
  // adaptive noise floor: learns the room's background level, so quiet pianos still register
  if(rms<noise*2) noise=noise*0.95+rms*0.05; else noise*=1.0004;
  const thr=Math.max(0.0012, noise*2.5)*(4/sens);
  $('level').style.width=Math.min(100,rms/(thr*6)*100)+'%';
  const onset = rms>thr && rms>prevRms*1.5;
  prevRms=rms;
  $('dbg').textContent='level '+rms.toFixed(4)+'  ·  needs > '+thr.toFixed(4);
  if(listening || now<muteUntil) return;
  if(rms<thr){ armed=true; cand=[]; $('heard').textContent='Waiting for a note…'; return; }
  if(onset){ armed=true; cand=[]; }
  const f=detectPitch(micBuf, ac.sampleRate, 0.0005); if(f<0) return;
  const m=Math.round(69+12*Math.log2(f/440));
  if(m<48||m>96) return;
  cand.push(m); if(cand.length>3) cand.shift();
  const n=cand.length;
  const stable3 = n===3 && cand[0]===cand[1] && cand[1]===cand[2];
  const stable2 = n>=2 && cand[n-1]===cand[n-2];
  // fold to the on-screen octave (C4–C5) so any octave on a real piano counts
  let fm=m; while(fm<60) fm+=12; while(fm>72) fm-=12;
  const target = idx<notes.length ? notes[idx] : null;
  const matches = target && (fm%12)===(target.midi%12);
  // fast path: right after a fresh strike, the expected note is accepted as soon as it sounds clean
  // (one clear frame, or two agreeing). Anything else, including wrong notes, still needs three agreeing frames.
  const fast = armed && matches && (lastClarity>0.9 || stable2);
  if(stable3 || fast){
    $('heard').textContent='Hearing: '+noteLabel(m)+'  ('+Math.round(f)+' Hz)';
    const isNew = armed || fm!==lastMidi;
    // a freshly struck note counts either way; a ringing tail can only ever move you forward
    if(isNew && (armed || matches)){
      armed=false; lastMidi=fm; fireRms=rms; cand=[];
      press(fm,'mic');
    }
  }
}
const PC=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function noteLabel(m){ return PC[((m%12)+12)%12]; }

/* ---------- wiring ---------- */
$('listen').addEventListener('click',startListen);
$('sens').addEventListener('input',e=>{ sens=+e.target.value; });
$('mic').addEventListener('click',()=>{ micOn?stopMic():startMic(); });
$('helpers').addEventListener('click',e=>{ helpers=!helpers; e.currentTarget.setAttribute('aria-pressed',helpers); render(); });
$('names').addEventListener('click',e=>{ showNames=!showNames; e.currentTarget.setAttribute('aria-pressed',showNames); render(); });
$('restart').addEventListener('click',()=>loadSong(songIdx));
$('lyrics').addEventListener('click',e=>{ showLyrics=!showLyrics; e.currentTarget.setAttribute('aria-pressed',showLyrics); render(); });
$('again').addEventListener('click',()=>loadSong(songIdx));
$('next').addEventListener('click',()=>loadSong((songIdx+1)%SONGS.length));
loadStore();
renderWho();
buildKeyboard();
loadSong(0);
</script>
